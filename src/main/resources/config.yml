# Digital Horror の設定ファイルです。
# 確率は 0.0（発生しない）から 1.0（必ず発生する）の範囲で指定します。
# 時間は特記がない限り tick 単位です。20 tick は約 1 秒です。
# メッセージでは %player% を対象プレイヤー名に置き換えます。
# 色コードは &7 や &k のように & を先頭に付けて指定できます。

system-distortion:
  # 偽チャット、就寝警告、アクションバー演出をまとめて有効化します。
  enabled: true
  # オンラインプレイヤーごとに演出を抽選する間隔です。
  check-interval-ticks: 600
  fake-chat:
    enabled: true
    chance: 0.08
    messages:
      - "誰か、今の見えましたか？"
      - "%player% はここにいません。"
      - "後ろを見ないでください。"
  bed-warning:
    enabled: true
    chance: 0.35
    messages:
      - "&c今は眠ることができません。近くで何かが見ています。"
      - "&7%player% は、まだ眠ってはいけません。"
  action-bar:
    enabled: true
    chance: 0.12
    # 文字化け表示から消えるまでの間隔です。
    fade-step-ticks: 8
    messages:
      - "&k%player%を観測しています"
      - "&k接続を維持しています"

tab-glitch:
  # ProtocolLib を使い、Tab リストへ偽プレイヤーを一時表示します。
  enabled: true
  check-interval-ticks: 900
  chance: 0.12
  # 偽プレイヤーを表示しておく時間です。
  visible-duration-ticks: 30
  # Minecraft の名前制限に合わせ、各名前は16文字以内を推奨します。
  fake-names:
    - "Unseen_Entity"
    - "NQQL89"
    - "Observer_404"

unseen-watcher:
  # プレイヤーの背後に、見られると消える監視者を生成します。
  enabled: true
  check-interval-ticks: 1200
  spawn-chance: 0.08
  min-distance: 5.0
  max-distance: 9.0
  vertical-offset: 0.0
  # プレイヤーの水平・垂直視野を簡略化した角度です。
  field-of-view-degrees: 95.0
  # 監視者が残れる最長時間です。
  lifetime-ticks: 200
  environment-change:
    # 視界外にレッドストーントーチを一時設置します。
    enabled: true
    chance: 0.03
    restore-after-ticks: 100

audio-anomaly:
  # 足音、遠隔音、低いガラス音、幻影の採掘者をまとめて有効化します。
  enabled: true
  # 移動状態を確認する間隔です。
  movement-check-interval-ticks: 2
  # プレイヤーが停止してから足音を再生するまでの時間です。10 tick は約0.5秒です。
  delayed-footstep-ticks: 10
  footstep-chance: 0.28
  # 遠隔音と無音化を抽選する間隔です。
  ambient-check-interval-ticks: 500
  distant-sound-chance: 0.12
  silence-chance: 0.04
  min-distance: 8.0
  max-distance: 18.0
  volume: 0.25
  pitch-min: 0.65
  pitch-max: 0.95
  glass-break:
    # ガラス系以外のブロックを壊したとき、低いガラス破壊音を本人だけに再生します。
    enabled: true
    chance: 0.02
    volume: 0.6
    # 通常より不自然に低い音程です。標準値は 0.55 です。
    pitch: 0.55
  phantom-miner:
    # 周囲の壁の中から、実在しない採掘音を一定のリズムで再生します。
    enabled: true
    # 発生を抽選する間隔です。3600 tick は約3分です。
    check-interval-ticks: 3600
    chance: 0.20
    # 音源を探す水平距離の範囲です。
    min-distance: 5.0
    max-distance: 12.0
    # プレイヤーの目線を基準に、音源を探す上下方向の範囲です。負の値は下方向です。
    min-vertical-offset: -4.0
    max-vertical-offset: -1.0
    # 音源へこの距離未満まで近づくと、採掘音は即座に停止します。
    approach-distance: 3.5
    # 石を叩く音の間隔と、石が壊れて次のブロックへ移るまでの間隔です。
    hit-interval-ticks: 5
    break-interval-ticks: 10
    # 1ブロックあたりの打撃回数と、一連の演出で壊すブロック数です。
    hits-per-block: 4
    block-count: 4
    volume: 0.45
    pitch: 0.8

hallucination:
  # ドア、手持ちアイテム、水中の暗闇演出をまとめて有効化します。
  enabled: true
  check-interval-ticks: 700
  door:
    enabled: true
    chance: 0.10
    search-radius: 10
    restore-distance: 3.0
    maximum-duration-ticks: 160
  held-item:
    enabled: true
    chance: 0.08
    duration-ticks: 30
    names:
      - "&4%player%の記憶"
      - "&k返してください"
      - "&8見つけました"
  underwater-darkness:
    # 目の位置が水中にあるプレイヤーへ、粒子とアイコンを隠した暗闇効果を付与します。
    enabled: true
    # 水中にいるか確認し、発生を抽選する間隔です。40 tick は約2秒です。
    check-interval-ticks: 40
    chance: 0.12
    # 暗闇効果の持続時間です。80 tick は約4秒です。
    duration-ticks: 80
    # 同じプレイヤーへ再び付与できるまでの時間です。900 tick は約45秒です。
    cooldown-ticks: 900
